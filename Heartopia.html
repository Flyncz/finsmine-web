<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finsmine - Heartopia Services</title>
    <style>
        /* Efek Muncul Halus */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0d1117;
            background-image: url('backgroundgh.jpg'); /* Background tetap sama */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background-color: rgba(13, 17, 23, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
            text-align: center;
        }

        h2 {
            color: #58a6ff;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .price-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
            text-align: left;
        }

        /* Desain Kotak Harga Biar Kece */
        .price-item {
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #c9d1d9;
            transition: 0.3s;
        }

        .price-item:hover {
            background: rgba(88, 166, 255, 0.2);
            border-color: #58a6ff;
            transform: scale(1.02);
        }

        .price-item span:first-child {
            font-weight: bold;
            color: #58a6ff;
        }

        /* Desain Kotak Kecil Untuk Harga */
        .price-item span:last-child {
            background: rgba(88, 166, 255, 0.2);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
            color: #ffffff;
            font-weight: bold;
        }

        /* Tombol Kembali */
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: transparent;
            color: #58a6ff;
            text-decoration: none;
            border: 1px solid #58a6ff;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            background-color: rgba(88, 166, 255, 0.1);
            transform: translateX(-5px); /* Efek geser kiri pas di-hover */
        }

        /* Responsif HP */
        @media (max-width: 600px) {
            h2 { font-size: 1.8em; }
            .price-item { 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 10px; 
            }
            .price-item span:last-child { align-self: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Heartopia Store</h2>
        
        <ul class="price-list">
            <li class="price-item">
                <span>10k Gold Farming</span>
                <span>Rp 15.000</span>
            </li>
            <li class="price-item">
                <span>50k Gold Farming</span>
                <span>Rp 70.000</span>
            </li>
            <li class="price-item">
                <span>Custom Song Recording</span>
                <span>Ask via Discord</span>
            </li>
        </ul>

        <a href="services.html" class="back-btn">← Kembali ke Kategori</a>
    </div>
</body>
</html>
