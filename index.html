<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finsmine - Official Website</title>
    <link rel="icon" type="image/png" href="ava.png">
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; background-color: #0d1117; background-image: url('backgroundgh.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; }
        .container { max-width: 600px; width: 100%; text-align: center; background-color: rgba(13, 17, 23, 0.85); padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); animation: fadeIn 1s ease-out; }
        .foto-chibi { width: 130px; height: 130px; object-fit: cover; border-radius: 50%; border: 4px solid #58a6ff; margin-bottom: 15px; }
        h1 { color: #58a6ff; font-size: 2.5em; margin: 0 0 10px 0; }
        p { color: #c9d1d9; font-size: 1.1em; margin-bottom: 25px; }
        .social-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .social-links a { padding: 10px 18px; background-color: #58a6ff; color: #0d1117; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.9em; transition: 0.3s; }
        .social-links a:hover { background-color: #82bfff; transform: translateY(-2px); }
        
        .joki-section { border-top: 1px solid #30363d; padding-top: 25px; text-align: center; }
        
        .menu-wrapper { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
        
        .joki-card { background: rgba(88, 166, 255, 0.1); border: 1px solid rgba(88, 166, 255, 0.4); padding: 20px; border-radius: 12px; color: #58a6ff; text-decoration: none; font-weight: bold; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; box-sizing: border-box; }
        .joki-card:hover { background: rgba(88, 166, 255, 0.2); border-color: #58a6ff; transform: scale(1.02); }
        .joki-card span { font-size: 0.8em; color: #c9d1d9; font-weight: normal; }
        
        @media (max-width: 600px) { .container { padding: 25px 15px; } h1 { font-size: 2em; } }
    </style>
</head>
<body>
<div class="container">
    <img src="ava.png" alt="Avatar" class="foto-chibi">

        <a href="https://sociabuzz.com/finsmine/tribe" target="_blank">Sociabuzz</a>

    </div>
    
    <div class="joki-section">
        <h3 style="color: #c9d1d9; margin-bottom: 5px;">🛒 Store & Services</h3>
        
        <div class="menu-wrapper">
            <a href="services" class="joki-card">

</html>
