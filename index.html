<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finsmine</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            
            background-color: #0d1117;
            background-image: url('backgroundgh.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .container {
            max-width: 600px;
            text-align: center;
            background-color: rgba(13, 17, 23, 0.85); 
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .foto-chibi {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #58a6ff;
            margin-bottom: 15px;
        }
        h1 {
            color: #58a6ff; 
            font-size: 3em;
            margin-top: 0;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #c9d1d9;
            margin-bottom: 30px;
        }
        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        
        /* --- SEKARANG SEMUA TOMBOL JADI BIRU --- */
        .social-links a {
            display: inline-block;
            padding: 12px 24px;
            background-color: #58a6ff; /* Biru Finsmine */
            color: #0d1117; /* Teks gelap biar kontras dan jelas */
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .social-links a:hover {
            background-color: #82bfff; /* Biru yang lebih terang pas di-hover */
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="ava.png" alt="Finsmine Avatar" class="foto-chibi">
        
        <h1>Finsmine</h1>
        <p>Welcome to Finsmine. I'm a streamer and creator dedicated to sharing what I love. My goal is simple, to share content that brings a little more joy and entertainment to your day.</p>
        <div class="social-links">
            <a href="https://www.youtube.com/@Finsmys" target="_blank">YouTube</a>
            <a href="https://www.tiktok.com/@notyoursmineagain" target="_blank">TikTok</a>
            <a href="https://saweria.co/finsmine" target="_blank">Saweria</a>
            <a href="https://sociabuzz.com/finsmine/tribe" target="_blank">Sociabuzz</a>
            <a href="https://discord.com/invite/mHC6Wx73sb" target="_blank">Discord</a>
            <a href="mailto:inquiry@finsmine.com">Email Me</a>
        </div>
    </div>
</body>
</html>
