<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finsmine - Official Website</title>
    <style>
        /* Efek Muncul Halus */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            background-color: #0d1117;
            background-image: url('backgroundgh.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background-color: rgba(13, 17, 23, 0.85); 
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out;
        }

        .foto-chibi {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #58a6ff;
            margin-bottom: 15px;
        }

        h1 { color: #58a6ff; font-size: 2.5em; margin: 0 0 10px 0; }
        p { color: #c9d1d9; font-size: 1.1em; margin-bottom: 25px; }
        
        /* Gaya Tombol Sosmed */
        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .social-links a {
            padding: 10px 18px;
            background-color: #58a6ff; 
            color: #0d1117; 
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9em;
            transition: 0.3s;
        }

        .social-links a:hover { background-color: #82bfff; transform: translateY(-2px); }

        /* Gaya List Joki (Accordion) */
        .joki-section {
            border-top: 1px solid #30363d;
            padding-top: 20px;
            text-align: left;
        }

        .joki-item {
            background: rgba(88, 166, 255, 0.05);
            border: 1px solid rgba(88, 166, 255, 0.3);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .joki-header {
            padding: 15px;
            cursor: pointer;
            color: #58a6ff;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .joki-content {
            display: none; 
            padding: 0 15px 15px 15px;
            color: #c9d1d9;
            border-top: 1px solid rgba(88, 166, 255, 0.1);
        }

        .price-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
        }

        .price-list li {
            padding: 5px 0;
            display: flex;
            justify-content: space-between;
        }

        /* Responsif HP */
        @media (max-width: 600px) {
            .container { padding: 25px 15px; }
            h1 { font-size: 2em; }
        }
    </style>
</head>
<body>

<div class="container">
    <img src="ava.png" alt="Avatar" class="foto-chibi">
    <h1>Finsmine</h1>
    <p>Official Links & Services</p>
    
    <div class="social-links">
        <a href="https://www.youtube.com/@Finsmys" target="_blank">YouTube</a>
        <a href="https://www.tiktok.com/@notyoursmineagain" target="_blank">TikTok</a>
        <a href="https://discord.com/invite/mHC6Wx73sb" target="_blank">Discord</a>
        <a href="https://saweria.co/finsmine" target="_blank">Saweria</a>
        <a href="https://sociabuzz.com/finsmine/tribe" target="_blank">Sociabuzz</a>
        <a href="mailto:inquiry@finsmine.com">Email Me</a>
    </div>

    <div class="joki-section">
        <h3 style="color: #c9d1d9; text-align: center; margin-bottom: 15px;">🎮 Jasa Joki / Services</h3>

        <div class="joki-item">
            <div class="joki-header" onclick="toggleJoki('gameA')">
                Heartopia <span>▼</span>
            </div>
            <div id="gameA" class="joki-content">
                <ul class="price-list">
                    <li><span>Gold Farming</span> <span>Cek via Discord</span></li>
                    <li><span>Custom Song Recording</span> <span>Cek via Discord</span></li>
                </ul>
            </div>
        </div>

        <div class="joki-item">
            <div class="joki-header" onclick="toggleJoki('gameB')">
                Roblox <span>▼</span>
            </div>
            <div id="gameB" class="joki-content">
                <ul class="price-list">
                    <li><span>Map Development</span> <span>Negotiable</span></li>
                    <li><span>Blender Assets</span> <span>Rp 20.000+</span></li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleJoki(id) {
        var x = document.getElementById(id);
        if (x.style.display === "block") {
            x.style.display = "none";
        } else {
            x.style.display = "block";
        }
    }
</script>

</body>
</html>
