<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finsmine - Roblox Store</title>
    <style>
        /* Efek Muncul Halus */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0d1117;
            background-image: url('backgroundgh.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background-color: rgba(13, 17, 23, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
            text-align: center;
        }

        h2 {
            color: #58a6ff;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 2em;
        }
        
        p.subtitle {
            color: #c9d1d9;
            font-size: 0.9em;
            margin-bottom: 25px;
        }

        h3.category-title {
            color: #c9d1d9;
            font-size: 1.2em;
            margin-bottom: 10px;
            margin-top: 20px;
            text-align: left;
            border-bottom: 1px solid rgba(88, 166, 255, 0.3);
            padding-bottom: 5px;
        }

        .price-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
            text-align: left;
        }

        .price-item {
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #c9d1d9;
            transition: 0.3s;
        }

        .price-item:hover {
            background: rgba(88, 166, 255, 0.2);
            border-color: #58a6ff;
            transform: scale(1.02);
        }

        .price-item span:first-child {
            font-weight: bold;
            color: #58a6ff;
        }

        .price-item span:last-child {
            background: rgba(88, 166, 255, 0.2);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
            color: #ffffff;
            font-weight: bold;
        }

        /* Gaya Tombol Order */
        .order-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #58a6ff;
            color: #0d1117;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 25px;
            margin-bottom: 15px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .order-btn:hover {
            background-color: #82bfff;
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(88, 166, 255, 0.4);
        }

        /* Gaya Tombol Kembali */
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: transparent;
            color: #58a6ff;
            text-decoration: none;
            border: 1px solid #58a6ff;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9em;
            transition: 0.3s;
        }

        .back-btn:hover {
            background-color: rgba(88, 166, 255, 0.1);
            transform: translateX(-5px); 
        }

        @media (max-width: 600px) {
            h2 { font-size: 1.8em; }
            .price-item { 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 10px; 
            }
            .price-item span:last-child { align-self: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Roblox Store</h2>
        <p class="subtitle">⚡ Proses cepat & aman | 🎟️ Proses via Gamepass ONLY</p>
        
        <h3 class="category-title">💰 Robux Price List (Min. 1000)</h3>
        <ul class="price-list">
            <li class="price-item"><span>1.000 Robux</span><span>Rp 125.000</span></li>
            <li class="price-item"><span>2.000 Robux</span><span>Rp 250.000</span></li>
            <li class="price-item"><span>3.000 Robux</span><span>Rp 375.000</span></li>
            <li class="price-item"><span>4.000 Robux</span><span>Rp 500.000</span></li>
            <li class="price-item"><span>5.000 Robux</span><span>Rp 625.000</span></li>
        </ul>

        <a href="https://discord.com/invite/mHC6Wx73sb" target="_blank" class="order-btn">🛒 Order via Discord</a>

        <a href="services.html" class="back-btn">← Kembali ke Kategori</a>
    </div>
</body>
</html>
